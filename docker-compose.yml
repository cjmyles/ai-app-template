services:
  db:
    image: postgres:16
    container_name: ai-app-template-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_app_template
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
